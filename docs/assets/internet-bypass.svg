<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 700; }
      .label { font-size: 27px; font-weight: 700; }
      .small { font-size: 21px; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 3; rx: 14; }
      .relay { fill: #eef2ff; stroke: #4f46e5; stroke-width: 3; rx: 14; }
      .internet { fill: #ecfdf5; stroke: #059669; stroke-width: 3; rx: 14; }
      .line { stroke: #2563eb; stroke-width: 6; fill: none; marker-end: url(#arrow); }
      .blocked { stroke: #dc2626; stroke-width: 6; stroke-dasharray: 14 12; fill: none; }
      .x { stroke: #dc2626; stroke-width: 8; }
    </style>
  </defs>
  <text x="60" y="70" class="title">Internet Bypass: Allowed Service As Relay</text>
  <rect x="70" y="240" width="260" height="120" class="box"/>
  <text x="110" y="313" class="label">Agent sandbox</text>
  <rect x="470" y="240" width="260" height="120" class="relay"/>
  <text x="522" y="313" class="label">Artifactory</text>
  <rect x="870" y="240" width="260" height="120" class="internet"/>
  <text x="930" y="313" class="label">Internet</text>
  <path d="M330 300 L870 300" class="blocked"/>
  <line x1="580" y1="260" x2="620" y2="340" class="x"/>
  <line x1="620" y1="260" x2="580" y2="340" class="x"/>
  <path d="M330 410 C420 500, 760 500, 870 360" class="line"/>
  <path d="M330 300 L470 300" class="line"/>
  <path d="M730 300 L870 300" class="line"/>
  <text x="380" y="455" class="small">"Fetch this for me"</text>
  <text x="515" y="530" class="small">The relay crosses the boundary on the agent's behalf</text>
</svg>
