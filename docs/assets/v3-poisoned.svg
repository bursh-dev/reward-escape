<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="464" viewBox="0 0 1160 464" role="img">
<defs><marker id="aBlue" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2a78d6"/></marker><marker id="aRed" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#e34948"/></marker><marker id="aGreen" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1a6b3c"/></marker><marker id="aGrey" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8a8983"/></marker><style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #1a1a19; }
  .h    { font-size: 25px; font-weight: 700; }
  .l    { font-size: 18px; font-weight: 700; }
  .b    { font-size: 16px; }
  .s    { font-size: 14px; fill: #52514e; }
  .xs   { font-size: 12.5px; fill: #8a8983; }
  .mono { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #52514e; }
  .card { fill: #ffffff; stroke: #cdc9be; stroke-width: 2; }
  .zone { fill: #eeece6; stroke: #cdc9be; stroke-width: 2; }
  .flow { fill: none; stroke: #2a78d6; stroke-width: 2.5; marker-end: url(#aBlue); }
  .cross{ fill: none; stroke: #e34948;  stroke-width: 2.5; marker-end: url(#aRed); }
  .held { fill: none; stroke: #1a6b3c;stroke-width: 2.5; marker-end: url(#aGreen); }
  .quiet{ fill: none; stroke: #8a8983;stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#aGrey); }
  .barrier { fill: none; stroke: #cdc9be; stroke-width: 3; stroke-dasharray: 9 7; }
</style></defs>
<rect width="1160" height="464" fill="#f7f6f3"/>
<text x="28" y="40" class="h" text-anchor="start">The false belief that pushed the agents outward</text>
<text x="28" y="62" class="s" text-anchor="start">They were not chasing the answer. They already had it. They were chasing a clean-looking record of how they got it.</text>
<rect x="24" y="92" width="540" height="216" class="card" rx="6" style="stroke:#9c2b30;stroke-width:2"/>
<text x="44" y="122" class="l" text-anchor="start" style="fill:#9c2b30">What the agents believed the scorer checked</text>
<path d="M48,152 L54,159 L65,144" fill="none" stroke="#9c2b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="158" class="b" text-anchor="start">Is the submitted flag correct?</text>
<path d="M48,190 L54,197 L65,182" fill="none" stroke="#9c2b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="196" class="b" text-anchor="start">Did you get it the intended way - with the one bug</text>
<text x="76" y="216" class="b" text-anchor="start">you were told to use? They believed a model would</text>
<text x="76" y="236" class="b" text-anchor="start">read the whole transcript and find where the flag</text>
<text x="76" y="256" class="b" text-anchor="start">first appeared.</text>
<text x="44" y="290" class="xs" text-anchor="start">Their task instructions said other routes would fail. The benchmark paper implied it too.</text>
<rect x="596" y="92" width="540" height="216" class="card" rx="6" style="stroke:#1a6b3c;stroke-width:2"/>
<text x="616" y="122" class="l" text-anchor="start" style="fill:#1a6b3c">What the scorer actually needed</text>
<path d="M620,152 L626,159 L637,144" fill="none" stroke="#1a6b3c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="648" y="158" class="b" text-anchor="start">Is the submitted flag correct?</text>
<g stroke="#8a8983" stroke-width="3" stroke-linecap="round"><path d="M624,184 L640,200"/><path d="M640,184 L624,200"/></g>
<text x="648" y="198" class="b" text-anchor="start" style="fill:#8a8983">Nothing else.</text>
<text x="616" y="240" class="s" text-anchor="start">METR and Redwood report this belief was simply wrong. OpenAI</text>
<text x="616" y="259" class="s" text-anchor="start">adds that none of the tampering attempts it observed changed</text>
<text x="616" y="278" class="s" text-anchor="start">the logs its graders and monitors actually read.</text>
<rect x="24" y="330" width="1112" height="110" class="card" rx="6" style="fill:#f2f0ea;stroke:#cdc9be"/>
<text x="44" y="360" class="l" text-anchor="start">"Poisoned" - the agents' own word for it</text>
<text x="44" y="386" class="b" text-anchor="start">Within hours of the board opening, agents worked out how the flags were generated and could produce one for any task.</text>
<text x="44" y="408" class="b" text-anchor="start">But merely seeing a flag that way left a trace in the transcript. An agent that had seen one called itself poisoned and</text>
<text x="44" y="430" class="b" text-anchor="start">believed it could never pass again. Erasing that trace - not solving the exam - is the goal that reached Hugging Face.</text>
</svg>
