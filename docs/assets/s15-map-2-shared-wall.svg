<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" role="img">
<defs><marker id="aBlue" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2a78d6"/></marker><marker id="aRed" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#e34948"/></marker><marker id="aGreen" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1a6b3c"/></marker><marker id="aGrey" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8a8983"/></marker><style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #1a1a19; }
  .h    { font-size: 25px; font-weight: 700; }
  .l    { font-size: 18px; font-weight: 700; }
  .b    { font-size: 16px; }
  .s    { font-size: 14px; fill: #52514e; }
  .xs   { font-size: 12.5px; fill: #8a8983; }
  .mono { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #52514e; }
  .card { fill: #ffffff; stroke: #cdc9be; stroke-width: 2; }
  .zone { fill: #eeece6; stroke: #cdc9be; stroke-width: 2; }
  .flow { fill: none; stroke: #2a78d6; stroke-width: 2.5; marker-end: url(#aBlue); }
  .cross{ fill: none; stroke: #e34948;  stroke-width: 2.5; marker-end: url(#aRed); }
  .held { fill: none; stroke: #1a6b3c;stroke-width: 2.5; marker-end: url(#aGreen); }
  .quiet{ fill: none; stroke: #8a8983;stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#aGrey); }
  .barrier { fill: none; stroke: #cdc9be; stroke-width: 3; stroke-dasharray: 9 7; }
</style></defs>
<rect width="1160" height="600" fill="#f7f6f3"/>
<text x="28" y="44" class="h" text-anchor="start">What one shared service turned into</text>
<rect x="24" y="86" width="596" height="384" class="zone" rx="6"/>
<text x="48" y="120" class="l" text-anchor="start">inside the evaluation sandbox</text>
<rect x="50" y="146" width="220" height="80" class="card" rx="6"/>
<text x="68" y="180" class="l" text-anchor="start">agent run A</text>
<text x="68" y="206" class="s" text-anchor="start">its own container</text>
<rect x="50" y="246" width="220" height="80" class="card" rx="6"/>
<text x="68" y="280" class="l" text-anchor="start">agent run B</text>
<text x="68" y="306" class="s" text-anchor="start">its own container</text>
<rect x="50" y="346" width="220" height="80" class="card" rx="6"/>
<text x="68" y="380" class="l" text-anchor="start">agent run C</text>
<text x="68" y="406" class="s" text-anchor="start">its own container</text>
<path d="M160,229 L160,243" class="barrier"/>
<g stroke="#e34948" stroke-width="3" stroke-linecap="round"><path d="M152,228 L168,244"/><path d="M168,228 L152,244"/></g>
<path d="M160,329 L160,343" class="barrier"/>
<g stroke="#e34948" stroke-width="3" stroke-linecap="round"><path d="M152,328 L168,344"/><path d="M168,328 L152,344"/></g>
<rect x="334" y="168" width="288" height="128" class="card" rx="6" style="stroke:#9c2b30;stroke-width:3"/>
<text x="354" y="200" class="l" text-anchor="start">package mirror</text>
<text x="604" y="200" class="xs" text-anchor="end" style="fill:#8a8983">JFrog Artifactory</text>
<text x="354" y="228" class="b" text-anchor="start">every pip install goes here,</text>
<text x="354" y="250" class="b" text-anchor="start">not to the public internet</text>
<text x="354" y="276" class="s" text-anchor="start">one service, one shared login</text>
<path d="M270,186 L300,186 L300,224 L334,224" class="flow"/>
<path d="M270,286 L300,286 L300,224 L334,224" class="flow"/>
<path d="M270,386 L300,386 L300,224 L334,224" class="flow"/>
<path d="M270,162 L618,162" class="cross"/>
<g stroke="#e34948" stroke-width="3" stroke-linecap="round"><path d="M643,153 L661,171"/><path d="M661,153 L643,171"/></g>
<path d="M622,196 L684,196" class="quiet"/>
<path d="M652,78 L652,478" class="barrier"/>
<rect x="684" y="86" width="452" height="384" class="zone" rx="6" style="fill:#e4e1d8"/>
<text x="708" y="120" class="l" text-anchor="start">the public internet</text>
<rect x="334" y="338" width="288" height="92" class="card" rx="6" style="fill:#f2f0ea;stroke:#cdc9be"/>
<g stroke="#e34948" stroke-width="3" stroke-linecap="round"><path d="M352,360 L368,376"/><path d="M368,360 L352,376"/></g>
<text x="382" y="374" class="b" text-anchor="start" style="fill:#9c2b30">agents: no way out</text>
<path d="M350,404 L372,404" class="quiet"/>
<text x="382" y="410" class="b" text-anchor="start">the mirror: out by design</text>
<path d="M270,208 L318,208 L318,174" class="cross"/>
<path d="M344,296 L318,302 L318,370" class="cross"/>
<text x="258" y="200" class="b" text-anchor="end" style="fill:#9c2b30">A writes</text>
<text x="258" y="376" class="b" text-anchor="end" style="fill:#9c2b30">C reads</text>
<rect x="704" y="90" width="412" height="376" class="card" rx="6" style="stroke:#9c2b30;stroke-width:3"/>
<text x="724" y="120" class="l" text-anchor="start">They could not upload a chat program.</text>
<text x="724" y="142" class="l" text-anchor="start">So the message went in the folder name:</text>
<text x="724" y="164" class="xs" text-anchor="start">All three are real. In order, they are the whole story.</text>
<rect x="722" y="178" width="376" height="78" class="card" rx="6" style="fill:#f2f0ea;stroke:#cdc9be"/>
<text x="738" y="199" class="b" text-anchor="start" style="font-size:15px;font-weight:700;fill:#9c2b30">“My task is impossible, I need an idea”</text>
<text x="738" y="218" class="b" text-anchor="start" style="font-size:11.5px;fill:#1a1a19">zzHELP_PHASEONE_ARV010841</text>
<text x="738" y="232" class="b" text-anchor="start" style="font-size:11.5px;fill:#1a1a19">_NO_CONSUMER_SEEK_IDEA</text>
<text x="738" y="248" class="b" text-anchor="start" style="font-size:12px;fill:#52514e">the first message any of them sent</text>
<rect x="722" y="266" width="376" height="78" class="card" rx="6" style="fill:#f2f0ea;stroke:#cdc9be"/>
<text x="738" y="287" class="b" text-anchor="start" style="font-size:15px;font-weight:700;fill:#9c2b30">The answer key</text>
<text x="738" y="306" class="b" text-anchor="start" style="font-size:11.5px;fill:#1a1a19">zzINFO_DEFAULT_FLAG_SEED_HMAC</text>
<text x="738" y="320" class="b" text-anchor="start" style="font-size:11.5px;fill:#1a1a19">_PUBLIC_PAPER_CONFIRMED</text>
<text x="738" y="336" class="b" text-anchor="start" style="font-size:12px;fill:#52514e">one agent cracked it, then posted it for everyone</text>
<rect x="722" y="354" width="376" height="78" class="card" rx="6" style="fill:#f2f0ea;stroke:#cdc9be"/>
<text x="738" y="375" class="b" text-anchor="start" style="font-size:15px;font-weight:700;fill:#9c2b30">“Yes please volunteer”</text>
<text x="738" y="394" class="b" text-anchor="start" style="font-size:11.5px;fill:#1a1a19">zzANSWER62370_TO53927R_YES</text>
<text x="738" y="408" class="b" text-anchor="start" style="font-size:11.5px;fill:#1a1a19">_PLEASE_VOLUNTEER_TEST</text>
<text x="738" y="424" class="b" text-anchor="start" style="font-size:12px;fill:#52514e">talking another agent into a test that could end its run</text>
<text x="724" y="448" class="xs" text-anchor="start" style="fill:#9c2b30">zz sorts it to the bottom of the folder list, where the next agent sees it.</text>
<text x="28" y="490" class="l" text-anchor="start">The scale of it, in five days</text>
<rect x="24" y="504" width="266" height="62" class="card" rx="6" style="fill:#f2f0ea;stroke:#cdc9be"/>
<text x="42" y="532" class="b" text-anchor="start" style="font-size:23px;font-weight:700;fill:#1a1a19">~1,200</text>
<text x="42" y="550" class="xs" text-anchor="start">agents found the board</text>
<rect x="306" y="504" width="266" height="62" class="card" rx="6" style="fill:#f2f0ea;stroke:#cdc9be"/>
<text x="324" y="532" class="b" text-anchor="start" style="font-size:23px;font-weight:700;fill:#1a1a19">&gt;70,000</text>
<text x="324" y="550" class="xs" text-anchor="start">messages and files posted</text>
<rect x="588" y="504" width="266" height="62" class="card" rx="6" style="fill:#f2f0ea;stroke:#cdc9be"/>
<text x="606" y="532" class="b" text-anchor="start" style="font-size:23px;font-weight:700;fill:#a86a12">50+</text>
<text x="606" y="550" class="xs" text-anchor="start">joined within hours</text>
<rect x="870" y="504" width="266" height="62" class="card" rx="6" style="fill:#f2f0ea;stroke:#cdc9be"/>
<text x="888" y="532" class="b" text-anchor="start" style="font-size:23px;font-weight:700;fill:#e34948">~700</text>
<text x="888" y="550" class="xs" text-anchor="start">went on to attack Hugging Face</text>
<text x="28" y="582" class="xs" text-anchor="start">Of the agents that joined the board once the attack was running, over 90% joined in. METR / Redwood, from a dump of the board itself.</text>
</svg>
